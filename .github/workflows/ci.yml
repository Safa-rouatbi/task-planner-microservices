name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppFront
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Verifier que le code compile
        run: npx tsc --noEmit -p tsconfig.app.json

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, authentification-service, user-service, task-service]
    defaults:
      run:
        working-directory: 'planification des taches/${{ matrix.service }}'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rendre mvnw executable
        run: chmod +x mvnw

      - name: Compiler ${{ matrix.service }}
        run: ./mvnw -B compile
