<div class="fixed inset-0 flex items-center justify-center z-50 bg-ink/40">
  <div class="bg-paper text-ink p-6 border border-line w-full max-w-2xl max-h-[90vh] overflow-y-auto">

    <div class="flex justify-between items-center mb-5">
      <h2 class="text-lg text-ink">Modifier la tâche</h2>
      <button (click)="onClose()" class="text-muted hover:text-ink text-sm">Fermer</button>
    </div>

    <div class="flex gap-4 mb-5 text-sm">
      <button (click)="setEtat('A faire')" [class.underline]="tache.etat === 'A faire'" [class.text-ink]="tache.etat === 'A faire'" class="text-muted hover:text-ink underline-offset-4">À faire</button>
      <button (click)="setEtat('En cours')" [class.underline]="tache.etat === 'En cours'" [class.text-ink]="tache.etat === 'En cours'" class="text-muted hover:text-ink underline-offset-4">En cours</button>
      <button (click)="setEtat('Terminée')" [class.underline]="tache.etat === 'Terminée'" [class.text-ink]="tache.etat === 'Terminée'" class="text-muted hover:text-ink underline-offset-4">Terminée</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="md:col-span-2">
        <label class="block text-xs text-muted mb-1">Titre</label>
        <input [(ngModel)]="tache.titre" placeholder="Titre" class="w-full border border-line px-3 py-2 text-sm bg-paper focus:outline-none focus:border-accent">
      </div>

      <div class="md:col-span-2">
        <label class="block text-xs text-muted mb-1">Description</label>
        <textarea [(ngModel)]="tache.description" rows="2" placeholder="Description" class="w-full border border-line px-3 py-2 text-sm bg-paper focus:outline-none focus:border-accent resize-none"></textarea>
      </div>

      <div>
        <label class="block text-xs text-muted mb-1">Début</label>
        <input type="datetime-local" [(ngModel)]="tache.dateDebut" class="w-full border border-line px-3 py-2 text-sm bg-paper focus:outline-none focus:border-accent">
      </div>

      <div>
        <label class="block text-xs text-muted mb-1">Durée (h)</label>
        <input type="number" [(ngModel)]="tache.dureeEnHeures" class="w-full border border-line px-3 py-2 text-sm bg-paper focus:outline-none focus:border-accent">
      </div>

      <div>
        <label class="block text-xs text-muted mb-1">Priorité</label>
        <select [(ngModel)]="tache.priorite" class="w-full border border-line px-3 py-2 text-sm bg-paper focus:outline-none focus:border-accent">
          <option value="FAIBLE">Faible</option>
          <option value="MOYENNE">Moyenne</option>
          <option value="HAUTE">Haute</option>
        </select>
      </div>

      <div>
        <label class="block text-xs text-muted mb-1">Agent</label>
        <select [(ngModel)]="tache.agentId" class="w-full border border-line px-3 py-2 text-sm bg-paper focus:outline-none focus:border-accent">
          <option value="">Sélectionner</option>
          @for (user of users; track user.id) {
            <option [value]="user.id">{{ user.nom }} {{ user.prenom }}</option>
          }
        </select>
      </div>

      <div class="md:col-span-2">
        <label class="block text-xs text-muted mb-1">Service</label>
        <select [(ngModel)]="tache.serviceId" class="w-full border border-line px-3 py-2 text-sm bg-paper focus:outline-none focus:border-accent">
          <option [value]="null">Aucun</option>
          @for (service of services; track service.id) {
            <option [value]="service.id">{{ service.nomService }}</option>
          }
        </select>
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-line">
      <button (click)="onClose()" class="border border-line px-4 py-2 text-sm text-muted hover:text-ink hover:border-ink transition-colors">Annuler</button>
      <button (click)="onDelete()" class="border border-line px-4 py-2 text-sm text-muted hover:text-accent hover:border-accent transition-colors">Supprimer</button>
      <button (click)="onSave()" class="bg-ink text-paper px-4 py-2 text-sm hover:bg-charcoal transition-colors">Enregistrer</button>
    </div>
  </div>
</div>
